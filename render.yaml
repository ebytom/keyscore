services:
  - type: web
    name: keyscore-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm --filter @keyscore/shared run build && pnpm --filter @keyscore/api run build
    startCommand: node packages/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
